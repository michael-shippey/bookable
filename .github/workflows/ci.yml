name: CI

# Run on every push to the main branch and on every pull request.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip  # reuse downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
        env:
          # CI-only value. The app refuses to start without a secret key,
          # but this one is never used anywhere real.
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
