# Render Blueprint: describes the deployed web service as code.
# The database lives on Neon (see README), so only the web service is here.
services:
  - type: web
    name: bookable
    runtime: docker          # builds from the repo's Dockerfile; its CMD runs start.sh
    plan: free
    region: ohio             # keep this close to the Neon region
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # you paste this in the Render dashboard; it is never committed
      - key: SECRET_KEY
        generateValue: true  # Render generates a long random secret for you
